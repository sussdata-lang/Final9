<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملف العرض التفاعلي المحدث — منظومة Uni-ERP الجامعية الموحدة v12.7</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #054239;
      --primary-dark: #032b24;
      --primary-light: #0d6e5f;
      --gold: #D5B65D;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Cairo', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 16px rgba(0,0,0,.14);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .crest {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(213,182,93,.18); border: 1.5px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--gold); font-size: 20px;
    }
    .badge-gold {
      background: var(--gold); color: var(--primary-dark);
      padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px; padding: 6px 12px; min-width: 280px;
    }
    .search-box input {
      background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px;
    }
    .search-box input::placeholder { color: rgba(255,255,255,.75); }
    .layout { display: grid; grid-template-columns: 295px 1fr; flex: 1; }
    aside {
      background: #fff; border-left: 1px solid var(--border);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 5px;
    }
    .nav-group {
      font-size: 11px; font-weight: 800; color: var(--muted);
      padding: 10px 10px 4px; text-transform: uppercase; letter-spacing: .3px;
    }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; text-align: right; padding: 10px 12px;
      border-radius: 10px; border: 1px solid transparent; background: transparent;
      color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; transition: .18s;
    }
    .nav-btn:hover { background: #f0fdf4; color: var(--primary); }
    .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(5,66,57,.22); }
    .nav-btn .code {
      font-size: 10.5px; padding: 2px 7px; border-radius: 6px;
      background: #e2e8f0; color: #334155; font-weight: 800;
    }
    .nav-btn.active .code { background: var(--gold); color: var(--primary-dark); }
    main { padding: 24px; overflow-y: auto; }
    .hero {
      background: linear-gradient(135deg, #054239 0%, #0d6e5f 100%);
      color: #fff; padding: 20px 24px; border-radius: 14px; margin-bottom: 18px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
    }
    .hero h2 { margin: 0 0 6px; font-size: 21px; }
    .hero p { margin: 0; color: #d1fae5; font-size: 13.5px; }
    .sub-tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
      background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
    }
    .chip {
      padding: 8px 14px; border-radius: 9px; border: 1px solid #cbd5e1;
      background: #f8fafc; color: #0f172a; font-size: 12.5px; font-weight: 700;
      cursor: pointer; transition: .15s;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border);
      border-right: 4px solid var(--primary); border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .kpi .label { font-size: 12px; color: var(--muted); font-weight: 700; }
    .kpi .val { font-size: 23px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-bottom: 16px;
    }
    .card h3 {
      margin: 0 0 12px; font-size: 15.5px; color: var(--primary);
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    th { background: #f8fafc; color: #334155; font-weight: 800; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
    .pill.ok { background: #dcfce7; color: #166534; }
    .pill.warn { background: #fef3c7; color: #92400e; }
    .pill.info { background: #dbeafe; color: #1e40af; }
    .btn {
      background: var(--primary); color: #fff; border: none;
      padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; transition: .15s;
    }
    .btn:hover { background: var(--primary-light); }
    .btn-gold { background: var(--gold); color: var(--primary-dark); }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 13px; margin-top: 4px; margin-bottom: 10px;
    }
    .step-box {
      border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px;
      background: #f8fafc; cursor: pointer; transition: .15s;
    }
    .step-box.active { border-color: var(--primary); background: #ecfdf5; box-shadow: 0 2px 8px rgba(5,66,57,.12); }
    #toast {
      position: fixed; bottom: 20px; left: 20px;
      background: var(--primary-dark); color: #fff; border: 1.5px solid var(--gold);
      padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 700;
      display: none; z-index: 1000; box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }
    @media print {
      header, aside, .no-print { display: none !important; }
      .layout { display: block; }
      main { padding: 0; }
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>

      const el = document.getElementById('toast');

      el.style.display = 'block';

    }

    function preserveScrollRender(fn) {
      const y = window.scrollY;
      fn();
      render();
      window.scrollTo(0, y);
    }

    function selectView(v) {
      preserveScrollRender(() => { STATE.view = v; });
    }

    function selectSubTab(view, tab) {
      preserveScrollRender(() => {
        STATE.view = view;
        STATE.subTab[view] = tab;
      });
    }

    function addDropdownItem() {
      const inp = document.getElementById('new-dd-item');

      inp.value = '';
      showToast('تمت إضافة البند الجديد إلى القائمة المنسدلة بنجاح');
      render();
    }

    function renderGenericSection(title, desc) {
      return `

    function handleGlobalSearch(q) {
      if (!q || !q.trim()) return;
      const v = q.trim();
      if (v.includes('امتحان') || v.includes('CYB') || v.includes('FOR')) selectView('academics');
      else if (v.includes('موظف') || v.includes('EMP') || v.includes('بصمة') || v.includes('إجازة')) selectView('payroll');
      else if (v.includes('داخلي') || v.includes('كتاب') || v.includes('ديوان')) selectView('corr');
      else if (v.includes('دليل') || v.includes('إرشاد')) selectView('guidelines');
    }

    function render() {
      renderSidebar();
      const main = document.getElementById('main-content');
      if (STATE.view === 'overview') main.innerHTML = renderOverview();
      else if (STATE.view === 'guidelines') main.innerHTML = renderGuidelines();
      else if (STATE.view === 'academics') main.innerHTML = renderAcademics();
      else if (STATE.view === 'payroll') main.innerHTML = renderPayroll();
      else if (STATE.view === 'corr') main.innerHTML = renderCorr();
      else if (STATE.view === 'admin') main.innerHTML = renderAdmin();
      else if (STATE.view === 'exchange') main.innerHTML = renderExchange();
      else if (STATE.view === 'audit') main.innerHTML = renderAudit();
      else if (STATE.view === 'affairs') main.innerHTML = renderGenericSection('شؤون الطلاب والقبول والإرشاد والمنح + التصوير عالي الدقة 4K/FHD', 'يضم القبول والمفاضلة، الإرشاد الأكاديمي، حركات القيد والانضباط، المنح المالية، ومكتب خدمة الطالب مع كاميرا عالية الدقة.');
      else if (STATE.view === 'finance') main.innerHTML = renderGenericSection('المالية والمحاسبة والمشتريات والمخازن والأصول', 'شجرة الحسابات، اليومية المزدوجة، رسوم الطلاب والأقساط، طلبات الشراء، والمستودعات.');
      else main.innerHTML = renderGenericSection('الوحدات الأكاديمية المتقدمة (التعلم، البحث، الخريجون، الجودة، والذكاء الاصطناعي)', 'تكامل الوحدات 5.12 إلى 5.17 مع المساعد الذكي والتحليلات المتقدمة.');
    }
