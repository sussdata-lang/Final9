<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ختم شؤون الطلاب</title>
<style>
  :root { --paper: #F6F3EA; --ink: #1F2A27; --muted: #5E6B66; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  figure { margin: 0; background: #fff; border: 1px solid #E3DED0; border-radius: 10px; padding: 20px; text-align: center; }
  figure img { width: 100%; max-width: 420px; height: auto; }
  figcaption { margin-top: 10px; color: var(--muted); font-size: 14px; }
  .actual img { width: 40mm; }
</style>
</head>
<body>
<main>
  <h1>ختم شؤون الطلاب — الجامعة السورية للعلوم الأمنية</h1>
  <p>نموذج بلون حبر واحد، غير مدمج بالموقع.</p>
  <div class="grid">
    <figure><img src="stamp-green.svg" alt="الختم بالحبر الأخضر"><figcaption>الأخضر الرسمي (#0A4F43)</figcaption></figure>
    <figure><img src="stamp-blue.svg" alt="الختم بالحبر الأزرق"><figcaption>الأزرق التقليدي (#1D3A8A)</figcaption></figure>
    <figure class="actual"><img src="stamp-blue.svg" alt="الختم بقطر 40 ملم"><figcaption>بالقطر المعتاد للأختام: 40 ملم</figcaption></figure>
  </div>
</main>
</body>
</html>
