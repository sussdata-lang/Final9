<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>نموذج واجهة الموظفين</title>
<link rel="icon" href="../uni-erp/public/icons/favicon-32.png">
<link rel="stylesheet" href="prototype.css">
<script>try { var t = localStorage.getItem('proto-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<a class="skip" href="#main">تخطي إلى المحتوى</a>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="القائمة الرئيسية">
    <div class="brand">
      <img src="../uni-erp/public/brand/crest.svg" alt="شعار الجامعة" width="38" height="44">
      <div class="brand-name"><strong>الجامعة السورية</strong><span>للعلوم الأمنية</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="side-fold" id="fold" type="button" title="Ctrl+B"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span>طي القائمة</span></button>
  </aside>
  <button class="scrim" id="scrim" type="button" aria-label="إغلاق القائمة"></button>
  <div class="page">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="فتح القائمة"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs" id="crumbs" aria-label="موقعك في النظام"></div>
      <button class="search" id="search" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>ابحث عن شاشة أو طلب أو طالب</span><kbd>Ctrl K</kbd></button>
      <span class="proto-flag" title="لا يتصل هذا النموذج بقاعدة البيانات، والأسماء والأرقام فيه توضيحية">نموذج أولي · بيانات توضيحية</span>
      <button class="icon-btn" id="theme" type="button" aria-label="تبديل المظهر"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg></button>
      <div class="pop-wrap">
        <button class="icon-btn" id="bell" type="button" aria-label="الإشعارات" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i class="dot"></i></button>
        <div class="pop" id="bell-pop" hidden></div>
      </div>
      <div class="me"><span class="avatar">م</span><div><strong>مدير النظام</strong><small>صلاحية كاملة</small></div></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="dr-title"></dialog>
<dialog class="sheet" id="sheet" aria-labelledby="sh-title"></dialog>
<dialog class="palette" id="palette" aria-label="البحث الشامل"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="catalog.js"></script>
<script src="prototype.js"></script>
</body>
</html>
